<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verifica tu cuenta</title>
</head>
<body style="margin:0; padding:0; background-color:#0f172a; font-family:Arial, Helvetica, sans-serif;">

    <table role="presentation" style="width:100%;">
        <tr>
            <td style="padding:40px 0; text-align:center;">

                <table role="presentation" style="width:600px; margin:0 auto; background-color:#111827; border-radius:10px; padding:30px;">
                    
                    <tr>
                        <td style="text-align:center; color:#38bdf8; font-size:28px; font-weight:bold;">
                            Forbbiden Island FEI Edition
                        </td>
                    </tr>

                    <tr>
                        <td style="padding:20px 0; color:#e5e7eb; font-size:16px;">
                            ¡Greetings!
                            <br><br>
                            Thanks for playing, to verify your account use this token:
                        </td>
                    </tr>

                    <tr>
                        <td style="padding:20px 0; text-align:center;">
                            <div style="
                                background-color:#020617;
                                color:#38bdf8;
                                font-size:32px;
                                font-weight:bold;
                                letter-spacing:4px;
                                padding:15px 30px;
                                border-radius:8px;
                                display:inline-block;">
                                {{TOKEN}}
                            </div>
                        </td>
                    </tr>

                    <tr>
                        <td style="padding-top:20px; color:#9ca3af; font-size:14px;">
                            If you did not request this email, you can ignore it.
                        </td>
                    </tr>

                    <tr>
                        <td style="padding-top:30px; text-align:center; color:#6b7280; font-size:12px;">
                            © 2026 Forbbiden Island FEI Edition
                        </td>
                    </tr>

                </table>

            </td>
        </tr>
    </table>

</body>
</html>
